name: Build Android APK

# Disparo manual: aba Actions -> "Build Android APK" -> Run workflow.
# Gera um APK release assinado e o disponibiliza como artifact.
on:
  workflow_dispatch:
    inputs:
      note:
        description: "Rótulo opcional pra identificar este build (aparece no resumo)"
        required: false
        default: ""

# Necessário para o `gh release upload` anexar o APK à release da versão.
permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reader-app
    env:
      # Embutida no bundle em build time. Sem isto o app cai no default localhost:4000
      # e não busca dados num aparelho real. Defina em Settings -> Secrets and variables.
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências (bun)
        run: bun install --frozen-lockfile

      - name: Decodificar keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Prebuild (gerar android/)
        run: bunx expo prebuild --platform android --no-install

      # Depois do prebuild: a pasta android/ (e os arquivos *.gradle) já existem,
      # então o cache do Gradle encontra o que hashear.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: reader-app/android/**/*.gradle*

      - name: Build APK release (Gradle)
        working-directory: reader-app/android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PMANGA_UPLOAD_STORE_FILE="$RUNNER_TEMP/release.keystore" \
            -PMANGA_UPLOAD_STORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PMANGA_UPLOAD_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -PMANGA_UPLOAD_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"

      # Versão atual do app 
      - name: Ler versão do app
        id: appver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Renomear APK com a versão
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          cp android/app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/apk/hokusai-manga-v${{ steps.appver.outputs.version }}.apk"

      - name: Publicar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: hokusai-manga-v${{ steps.appver.outputs.version }}-${{ github.run_number }}
          path: ${{ runner.temp }}/apk/hokusai-manga-v${{ steps.appver.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 30

      # Anexa o APK à GitHub Release da versão (tag v<versão> criada pelo semantic-release).
      # --clobber sobrescreve o asset se você rebuildar a mesma versão. Falha claramente
      # se a release ainda não existir (ex.: buildou antes do release rodar naquela branch).
      - name: Anexar APK à release da versão
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ steps.appver.outputs.version }}" \
            "$RUNNER_TEMP/apk/hokusai-manga-v${{ steps.appver.outputs.version }}.apk" \
            --clobber
